<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2d1b4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1628;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="neonGlow1" cx="30%" cy="40%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="neonGlow2" cx="70%" cy="30%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="brightGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Sky Gradient -->
  <rect width="1920" height="1080" fill="url(#skyGradient)"/>
  
  <!-- Neon Glows -->
  <ellipse cx="576" cy="432" rx="600" ry="800" fill="url(#neonGlow1)"/>
  <ellipse cx="1344" cy="216" rx="500" ry="700" fill="url(#neonGlow2)"/>

  <!-- Far Background Stars -->
  <circle cx="200" cy="150" r="1.5" fill="#00ffff" opacity="0.6"/>
  <circle cx="450" cy="200" r="1" fill="#ff006e" opacity="0.5"/>
  <circle cx="800" cy="120" r="1.2" fill="#00ffff" opacity="0.7"/>
  <circle cx="1200" cy="180" r="1" fill="#ff006e" opacity="0.4"/>
  <circle cx="1600" cy="100" r="1.5" fill="#00ffff" opacity="0.6"/>
