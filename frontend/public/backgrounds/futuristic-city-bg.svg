    <rect x="320" y="740" width="35" height="45" fill="#9933ff" opacity="0.7"/>
    <rect x="365" y="760" width="35" height="50" fill="#00ffff" opacity="0.7"/>
    <rect x="410" y="750" width="35" height="45" fill="#ff006e" opacity="0.6"/>
