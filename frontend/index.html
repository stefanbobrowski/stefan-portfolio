<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Full-Stack Engineer with 10+ years building scalable web applications. AI-powered systems, React, TypeScript, Node.js, Google Cloud Platform. Help small businesses implement SEO strategies and drive traffic."
    />

    <!-- Open Graph Tags (LinkedIn, Twitter, Social Sharing) -->
    <meta property="og:title" content="Stefan Bobrowski - Full-Stack Engineer & SEO Specialist" />
    <meta
      property="og:description"
      content="Full-Stack Engineer with 10+ years building scalable web applications. Specializing in AI integration, modern JavaScript frameworks, and SEO strategies for small businesses."
    />
    <meta property="og:image" content="https://stefanbobrowski.com/StefanBobrowskiAvatar.jpeg" />
    <meta property="og:url" content="https://stefanbobrowski.com" />
    <meta property="og:type" content="profile" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stefan Bobrowski - Full-Stack Engineer" />
    <meta
      name="twitter:description"
      content="AI-powered apps, React, TypeScript, Node.js, GCP. SEO & growth strategies for small businesses."
    />
    <meta name="twitter:image" content="https://stefanbobrowski.com/StefanBobrowskiAvatar.jpeg  " />

    <!-- Canonical URL - Tells Google which version to index -->
    <link rel="canonical" href="https://stefanbobrowski.com" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8CGYGKTFD0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-8CGYGKTFD0');
    </script>

    <!-- Preload critical fonts -->
    <link
      rel="preload"
      href="/fonts/GoogleSans/GoogleSans-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GoogleSans/GoogleSans-Bold.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />

    <title>Stefan Bobrowski - Full-Stack Engineer</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- JSON-LD Structured Data (tells Google you're a real person/professional) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Stefan Bobrowski",
        "jobTitle": "Full-Stack Engineer",
        "url": "https://stefanbobrowski.com",
        "sameAs": ["https://linkedin.com/in/stefanbobrowski", "https://github.com/stefanbobrowski"],
        "knowsAbout": [
          "JavaScript",
          "TypeScript",
          "React",
          "Node.js",
          "Google Cloud Platform",
          "AI Integration",
          "Web Development",
          "SEO"
        ],
        "description": "Full-Stack Engineer with 10+ years building intelligent, scalable web applications. Specializing in AI capabilities, modern frameworks, and SEO strategies for small businesses."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" defer></script>
  </body>
</html>
